  amp_dtype: bf16-mixed
  epochs: 10
  accum_iter: 1
  grad_clip_norm: 1.0
  weight_decay: 0.01
  lr: 1.0e-06
  warmup_epochs: 0
  lr_scheduler: cosine
  lr_scheduler_eta_min: 2.0e-07
  kl_weight: 0.001
  sample_posterior: true
  surface_geo_normalize_mode: cube
  surface_geo_use_camera_translation: true
  latent_reconstruction_loss_weight: 0.2
  timestep_sampling: uniform
  timestep_mu: -0.8
  timestep_sigma: 0.8
  timestep_p_zero: 0.1
  eval_freq: 0.25
  save_freq: 2
  keep_freq: false
  val_num_save: 2
  test_guidance_scale: 5.0
