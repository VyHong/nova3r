      num_latents: 4096
      embed_dim: 64
      width: 1024
      heads: 16
      num_encoder_layers: 8
      num_decoder_layers: 16
      pc_size: 81920
      pc_sharpedge_size: 0
      point_feats: 4
      num_freqs: 8
      include_pi: false
      qkv_bias: false
      qk_norm: true
      geo_decoder_mlp_expand_ratio: 4
      geo_decoder_downsample_ratio: 1
      geo_decoder_ln_post: true
      scale_factor: 1.0039506158752403
  model:
    name: HunYuanDiTPlain
    params:
      input_size: 4096
      in_channels: 64
      hidden_size: 2048
      context_dim: 1024
      depth: 21
      num_heads: 16
      mlp_ratio: 4.0
      norm_type: layer
      qk_norm_type: rms
      qk_norm: true
      qkv_bias: false
      text_len: 2048
      with_decoupled_ca: false
      use_pos_emb: false
      use_attention_pooling: false
      num_moe_layers: 6
