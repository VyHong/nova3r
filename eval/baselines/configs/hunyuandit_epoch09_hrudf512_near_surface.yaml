# HRUDF512 near-surface retry preset. Room output validation is pending.
cfg:
  checkpoint: checkpoints/hunyuan_dit/model.fp16.ckpt
  load_weights: true
  vae_ckpt: exp_output/hunyuan_vae/checkpoints/last.ckpt
  resume_checkpoint: exp_output/hunyuandit_panorama/checkpoints/last-v1.ckpt
  vae:
